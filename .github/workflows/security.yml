name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Public release audit
        run: npm run public:audit

      - name: Lint
        run: npm run lint

      # Fails on any high or critical advisory, except the ones recorded in
      # scripts/audit-gate.mjs with a reason and a review date.
      - name: Audit dependencies
        run: npm run audit:gate
