<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS 3365 – Software Engineering Exam 1 Practice</title>
  <meta name="description" content="Practice quiz for CS 3365 Software Engineering Exam 1 covering Chapters 1-4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #07071a;
      --bg-mid: #0e1030;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --accent: #6c7bff;
      --accent-glow: rgba(108,123,255,0.25);
      --accent-soft: rgba(108,123,255,0.12);
      --green: #4ade80;
      --green-soft: rgba(74,222,128,0.12);
      --green-border: rgba(74,222,128,0.4);
      --red: #f87171;
      --red-soft: rgba(248,113,113,0.12);
      --red-border: rgba(248,113,113,0.4);
      --yellow: #fbbf24;
      --text: #e8eaff;
      --text-dim: rgba(255,255,255,0.5);
      --text-dimmer: rgba(255,255,255,0.3);
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.12);
      --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #root { min-height: 100vh; }

    /* Background gradient animation */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(108,123,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Start Screen ── */
    .start-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .start-card {
      max-width: 580px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 44px;
      text-align: center;
      backdrop-filter: blur(24px);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .start-label {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .start-title {
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .start-subtitle {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 36px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 32px;
    }

    .stat-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 12px;
    }

    .stat-value {
      font-family: var(--mono);
      color: var(--accent);
      font-size: 24px;
      font-weight: 700;
    }

    .stat-label {
      color: var(--text-dimmer);
      font-size: 11px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .note-box {
      background: var(--accent-soft);
      border: 1px solid rgba(108,123,255,0.2);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 36px;
      text-align: left;
    }

    .note-title {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .note-text {
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.6;
    }

    .btn-primary {
      background: linear-gradient(135deg, #5b6bff 0%, #8b5cf6 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px 52px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: var(--font);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .btn-primary:active { transform: translateY(0); }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,7,26,0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .q-counter {
      font-family: var(--mono);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
    }

    .badge {
      font-size: 11px;
      padding: 3px 12px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-prof {
      background: rgba(251,191,36,0.12);
      color: var(--yellow);
    }

    .badge-chapter {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .timer {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }

    .timer-ok { color: var(--accent); }
    .timer-warn { color: var(--red); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ── Question Area ── */
    .question-area {
      flex: 1;
      padding: 36px 24px;
      max-width: 740px;
      margin: 0 auto;
      width: 100%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .question-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 6px;
      color: #fff;
    }

    .question-hint {
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 16px 20px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font);
      width: 100%;
    }

    .option-btn:not(:disabled):hover {
      background: var(--bg-card-hover);
      border-color: rgba(255,255,255,0.18);
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.selected {
      background: var(--accent-soft);
      border-color: rgba(108,123,255,0.5);
    }

    .option-btn.correct {
      background: var(--green-soft);
      border-color: var(--green-border);
    }

    .option-btn.incorrect {
      background: var(--red-soft);
      border-color: var(--red-border);
    }

    .option-btn.missed {
      background: rgba(74,222,128,0.05);
      border-color: rgba(74,222,128,0.2);
    }

    .radio {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--text-dimmer);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: 2px solid var(--text-dimmer);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .radio.checked, .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-mark {
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    /* Free response */
    .free-textarea {
      width: 100%;
      min-height: 200px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 18px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.7;
      font-family: var(--font);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      margin-top: 16px;
    }

    .free-textarea:focus {
      border-color: rgba(108,123,255,0.5);
    }

    .free-textarea:disabled {
      opacity: 0.6;
    }

    /* Explanation */
    .explanation-toggle {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 600;
      padding: 0;
      margin-top: 20px;
    }

    .explanation-box {
      margin-top: 12px;
      background: var(--accent-soft);
      border: 1px solid rgba(108,123,255,0.2);
      border-radius: 12px;
      padding: 18px 22px;
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      line-height: 1.7;
      animation: fadeIn 0.25s ease;
    }

    .explanation-label {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Footer Nav ── */
    .footer-nav {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background: rgba(7,7,26,0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      bottom: 0;
      z-index: 20;
    }

    .btn-nav {
      border: none;
      border-radius: 10px;
      padding: 11px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font);
    }

    .btn-prev {
      background: rgba(255,255,255,0.07);
      color: var(--text);
    }

    .btn-prev:disabled {
      color: var(--text-dimmer);
      cursor: default;
    }

    .btn-next {
      background: linear-gradient(135deg, #5b6bff, #8b5cf6);
      color: #fff;
    }

    .btn-next:disabled {
      background: rgba(255,255,255,0.07);
      color: var(--text-dimmer);
      cursor: default;
    }

    .btn-submit {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 11px 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      transition: transform 0.15s;
    }

    .btn-submit:hover { transform: translateY(-1px); }

    .dots-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-width: 420px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s;
    }

    .dot-empty { background: rgba(255,255,255,0.12); }
    .dot-answered { background: var(--accent); }
    .dot-current { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Results ── */
    .results-screen {
      padding: 40px 24px;
      max-width: 740px;
      margin: 0 auto;
      width: 100%;
      animation: fadeUp 0.5s ease-out;
    }

    .results-hero {
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 36px;
      margin-bottom: 28px;
    }

    .results-label {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .results-pct {
      font-family: var(--mono);
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
    }

    .results-pct.great { color: var(--green); }
    .results-pct.ok { color: var(--yellow); }
    .results-pct.low { color: var(--red); }

    .results-detail {
      color: var(--text-dim);
      font-size: 15px;
      margin-top: 10px;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }

    .chapter-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
    }

    .chapter-label {
      color: var(--text-dimmer);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chapter-score {
      font-family: var(--mono);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      margin-top: 6px;
    }

    .chapter-bar {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }

    .chapter-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.8s ease;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .start-card { padding: 36px 24px; }
      .start-title { font-size: 26px; }
      .stats-row { grid-template-columns: 1fr; gap: 10px; }
      .question-text { font-size: 18px; }
      .header { padding: 12px 16px; }
      .question-area { padding: 24px 16px; }
      .footer-nav { padding: 12px 16px; }
      .dots-container { max-width: 260px; }
      .chapter-grid { grid-template-columns: 1fr; }
      .results-pct { font-size: 56px; }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ═══════════════════════════════════════════
    //  QUESTIONS DATABASE
    // ═══════════════════════════════════════════
    const QUESTIONS = [
      {
        id: 1, chapter: 1, type: "single", fromProfessor: true,
        question: 'In a "Plan-driven" process, how is progress typically measured?',
        options: [
          "By the number of user stories completed each day.",
          "Against a pre-determined plan of activities and stages.",
          "Based on the customer's satisfaction at the end of each sprint.",
          "Based on the level of pair programming used.",
        ],
        answer: [1],
        explanation: "In plan-driven processes (like Waterfall), progress is measured against a pre-determined plan with defined activities and stages, unlike agile where progress is measured by working software increments.",
      },
      {
        id: 2, chapter: 3, type: "single", fromProfessor: true,
        question: 'In the Scrum agile method, what is a "Sprint"?',
        options: [
          "A race between developers to finish their code.",
          "A fixed time period, usually 2-4 weeks, during which a system increment is developed.",
          "A meeting where the Scrum Master reports to the CEO.",
          "The process of moving requirements from the product backlog to the archive.",
          "A specialized tool used for automated testing.",
          "The final release of the software to the customer.",
          "A method for scaling agile to large organizations.",
        ],
        answer: [1],
        explanation: "A Sprint is a fixed time period (typically 2-4 weeks) during which a potentially shippable system increment is developed. It's the core iteration cycle in Scrum.",
      },
      {
        id: 3, chapter: 1, type: "single", fromProfessor: true,
        question: "Software engineering ethics dictate that engineers should NOT:",
        options: [
          "Respect the confidentiality of employers or clients.",
          "Misuse their skills to take over or damage others' computers.",
          "Be honest about their level of competence.",
          "Support the professional software development of their colleagues.",
        ],
        answer: [1],
        explanation: "B is what engineers should NOT do. The question asks what they should NOT do — misusing skills to damage others' computers is unethical. Options A, C, and D are all things engineers SHOULD do according to the ACM/IEEE Code of Ethics.",
      },
      {
        id: 4, chapter: 3, type: "multi", fromProfessor: true,
        question: "What are the characteristics of agile development? (Select all that apply)",
        options: [
          "Detailed documentation.",
          "Mostly focused on coding.",
          "Frequent delivery of new versions.",
          "Implementation starts after the system design has been fully completed.",
          "Minimal documentation.",
          "None of the above.",
        ],
        answer: [1, 2, 4],
        explanation: "Agile development is characterized by: focus on coding over documentation, frequent delivery of new versions for evaluation, and minimal documentation with focus on working code. Detailed documentation and completing design before implementation are plan-driven traits.",
      },
      {
        id: 5, chapter: 2, type: "single", fromProfessor: true,
        question: "The prototype of the software will be very close to the final software version. Therefore, the prototype should not be discarded.",
        options: ["True", "False"],
        answer: [1],
        explanation: "False. Prototypes are typically throw-away. They are built to explore requirements and validate ideas, not to become the final product. Prototypes often cut corners on structure and quality, so they should be discarded after serving their purpose.",
      },
      {
        id: 6, chapter: 1, type: "single", fromProfessor: true,
        question: "There are two types of software products: Generic products and customized products. Which one of the following statements is true about a generic product?",
        options: [
          "Software that is commissioned for specific customer needs.",
          "Software that is developed to maintain the hardware in a specific factory.",
          "Software made for any customer who wants to buy it.",
          "Banking app made for a specific bank to manage its internal activities (ex: Citi bank).",
        ],
        answer: [2],
        explanation: "Generic products (also called COTS — Commercial Off-The-Shelf) are stand-alone systems produced for a general market and sold to any customer who wants to buy them. Options A, B, and D describe customized (bespoke) products.",
      },
      {
        id: 7, chapter: 2, type: "multi", fromProfessor: true,
        question: "The Waterfall Model presents the software development process in a number of stages. What are the phases of the waterfall model? (Select all that apply)",
        options: [
          "Requirements analysis and definition",
          "Customer involvement",
          "System and software design",
          "Product increments",
          "Implementation and unit testing",
          "Integration and system testing",
          "Version development",
          "Operation and maintenance",
        ],
        answer: [0, 2, 4, 5, 7],
        explanation: "The five phases of the Waterfall Model are: (1) Requirements analysis and definition, (2) System and software design, (3) Implementation and unit testing, (4) Integration and system testing, (5) Operation and maintenance.",
      },
      {
        id: 8, chapter: 1, type: "single", fromProfessor: true,
        question: "Which essential software product attribute ensures the system can be adapted to meet the changing needs of customers?",
        options: ["Dependability", "Efficiency", "Security", "Maintainability", "Portability"],
        answer: [3],
        explanation: "Maintainability means software should be written so it can evolve to meet the changing needs of customers. This is one of the four essential product attributes.",
      },
      {
        id: 9, chapter: 1, type: "single",
        question: "What is the key difference between software engineering and computer science?",
        options: [
          "Software engineering focuses on theories and fundamentals, while computer science focuses on practical development.",
          "Computer science focuses on theories and fundamentals, while software engineering is concerned with the practicalities of developing useful software.",
          "They are the same discipline with different names.",
          "Computer science only deals with hardware design.",
        ],
        answer: [1],
        explanation: "Computer science focuses on theory and fundamentals. Software engineering is concerned with the practicalities of developing and delivering useful software to customers.",
      },
      {
        id: 10, chapter: 1, type: "single",
        question: "Which essential software product attribute means the software should not cause physical or economic damage in the event of system failure?",
        options: ["Maintainability", "Acceptability", "Dependability and Security", "Efficiency"],
        answer: [2],
        explanation: "Dependability and security means software should not cause physical or economic damage in the event of system failure. It includes reliability, security, and safety.",
      },
      {
        id: 11, chapter: 1, type: "single",
        question: "Which of the following is true about maintenance costs in software engineering?",
        options: [
          "Maintenance costs are typically less than development costs.",
          "Maintenance costs usually exceed development costs for long-lived systems.",
          "Maintenance is not necessary for well-designed software.",
          "Maintenance only includes fixing bugs.",
        ],
        answer: [1],
        explanation: "For most long-lived software systems, the majority of costs are in maintaining and evolving the software after deployment, not in original development.",
      },
      {
        id: 12, chapter: 1, type: "single",
        question: 'What is a "system of systems"?',
        options: [
          "A single monolithic application.",
          "A system built by integrating multiple independently managed systems to create a new system.",
          "A backup system that mirrors the primary system.",
          "A system that only runs on one operating system.",
        ],
        answer: [1],
        explanation: "A system of systems is created by integrating independently managed systems to form a new, larger system with emergent properties.",
      },
      {
        id: 13, chapter: 1, type: "single",
        question: "Which essential product attribute means the software must be understandable, usable, and compatible with existing systems?",
        options: ["Efficiency", "Maintainability", "Acceptability", "Dependability"],
        answer: [2],
        explanation: "Acceptability means the software must be acceptable to its users — understandable, usable, and compatible with other systems they use.",
      },
      {
        id: 14, chapter: 2, type: "single",
        question: "Which software process model develops the system as a series of versions (increments), with each version adding functionality?",
        options: ["Waterfall Model", "Incremental Development", "Reuse-oriented Software Engineering", "Formal Methods"],
        answer: [1],
        explanation: "Incremental development interleaves specification, development, and validation. The system is developed as a series of increments.",
      },
      {
        id: 15, chapter: 2, type: "single",
        question: "In the software process, which activity involves checking that the software meets its specification and the customer's actual needs?",
        options: ["Specification", "Design and Implementation", "Validation", "Evolution"],

    const TOTAL_TIME = 60 * 60;

    function App() {
      const [screen, setScreen] = useState("start");
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState({});
      const [showExplanation, setShowExplanation] = useState({});
      const [timeLeft, setTimeLeft] = useState(TOTAL_TIME);
      const [timerActive, setTimerActive] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const timerRef = useRef(null);

      useEffect(() => {
        if (timerActive && timeLeft > 0) {
          timerRef.current = setInterval(() => {
            setTimeLeft((t) => {
              if (t <= 1) {
                clearInterval(timerRef.current);
                setSubmitted(true);
                setScreen("results");
                return 0;
              }
              return t - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [timerActive]);

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, "0")}`;
      };

      const handleSelect = useCallback((qId, optIdx) => {
        if (submitted) return;
        const q = QUESTIONS.find((q) => q.id === qId);
        if (q.type === "free") {
          setAnswers((prev) => ({ ...prev, [qId]: optIdx }));
          return;
        }
        if (q.type === "multi") {
          setAnswers((prev) => {
            const current = prev[qId] || [];
            const updated = current.includes(optIdx)
              ? current.filter((i) => i !== optIdx)
              : [...current, optIdx];
            return { ...prev, [qId]: updated };
          });
        } else {
          setAnswers((prev) => ({ ...prev, [qId]: [optIdx] }));
        }
      }, [submitted]);

      const isCorrect = useCallback((qId) => {
        const q = QUESTIONS.find((q) => q.id === qId);
        if (q.type === "free") return null;
        const userAns = answers[qId] || [];
        if (userAns.length !== q.answer.length) return false;
        return q.answer.every((a) => userAns.includes(a)) && userAns.every((a) => q.answer.includes(a));
      }, [answers]);

      const getScore = useCallback(() => {
        let correct = 0, total = 0;
        QUESTIONS.forEach((q) => {
          if (q.type !== "free") {
            total++;
            if (isCorrect(q.id)) correct++;
          }
        });
        return { correct, total };
      }, [isCorrect]);

      const startExam = () => {
        setScreen("exam");
        setTimerActive(true);
        setCurrentQ(0);
      };

      const handleSubmit = () => {
        if (!window.confirm("Submit your exam? You won't be able to change answers.")) return;
        setSubmitted(true);
        setTimerActive(false);
        clearInterval(timerRef.current);
        setScreen("results");
      };

      const resetExam = () => {
        setScreen("start");
        setCurrentQ(0);
        setAnswers({});
        setShowExplanation({});
        setTimeLeft(TOTAL_TIME);
        setTimerActive(false);
        setSubmitted(false);
      };

      const q = QUESTIONS[currentQ];
      const { correct, total } = getScore();
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      const isReview = screen === "review";

      // ── Start Screen ──
      if (screen === "start") {
        return (
          <div className="app-container">
            <div className="start-screen">
              <div className="start-card">
                <div className="start-label">CS 3365 — Software Engineering</div>
                <h1 className="start-title">Exam 1 Practice Quiz</h1>
                <p className="start-subtitle">Chapters 1, 2, 3 &amp; 4</p>
                <div className="stats-row">
                  <div className="stat-box">
                    <div className="stat-value">41</div>
                    <div className="stat-label">Questions</div>
                  </div>
                  <div className="stat-box">
                    <div className="stat-value">60m</div>
                    <div className="stat-label">Time Limit</div>
                  </div>
                  <div className="stat-box">
                    <div className="stat-value">8</div>
                    <div className="stat-label">Prof Questions</div>
                  </div>
                </div>
                <div className="note-box">
                  <div className="note-title">📌 Note</div>
                  <div className="note-text">
                    Questions 1–8 are directly from your professor's slides. Questions 9–39 cover remaining exam topics. Questions 40–41 are free response.
                  </div>
                </div>
                <button className="btn-primary" onClick={startExam}>Start Exam</button>
              </div>
            </div>
          </div>
        );
      }

      // ── Results Screen ──
      if (screen === "results") {
        return (
          <div className="app-container">
            <div className="results-screen">
              <div className="results-hero">
                <div className="results-label">Final Score</div>
                <div className={`results-pct ${pct >= 70 ? "great" : pct >= 50 ? "ok" : "low"}`}>
                  {pct}%
                </div>
                <div className="results-detail">
                  {correct} / {total} multiple choice correct
                </div>
                <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 28 }}>
                  <button className="btn-primary" onClick={() => { setScreen("review"); setCurrentQ(0); }}>
                    Review Answers
                  </button>
                  <button className="btn-nav btn-prev" onClick={resetExam} style={{ padding: "15px 32px", fontSize: 16 }}>
                    Retake
                  </button>
                </div>
              </div>

              <div className="chapter-grid">
                {[1, 2, 3, 4].map((ch) => {
                  const chQs = QUESTIONS.filter((q) => q.chapter === ch && q.type !== "free");
                  const chCorrect = chQs.filter((q) => isCorrect(q.id)).length;
                  const chPct = chQs.length > 0 ? (chCorrect / chQs.length) * 100 : 0;
                  return (
                    <div key={ch} className="chapter-box">
                      <div className="chapter-label">Chapter {ch}</div>
                      <div className="chapter-score">{chCorrect}/{chQs.length}</div>
                      <div className="chapter-bar">
                        <div
                          className="chapter-bar-fill"
                          style={{
                            width: `${chPct}%`,
                            background: chPct >= 70 ? "var(--green)" : chPct >= 50 ? "var(--yellow)" : "var(--red)",
                          }}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      // ── Exam / Review Screen ──
      const isAnswered = (idx) => {
        const qq = QUESTIONS[idx];
        const a = answers[qq.id];
        if (qq.type === "free") return a && a.length > 0;
        return a && a.length > 0;
      };

      return (
        <div className="app-container">
          {/* Header */}
          <div className="header">
            <div className="header-left">
              <span className="q-counter">Q{currentQ + 1}/{QUESTIONS.length}</span>
              {q.fromProfessor && <span className="badge badge-prof">⭐ FROM PROFESSOR</span>}
              <span className="badge badge-chapter">Ch. {q.chapter}</span>
            </div>
            {!isReview ? (
              <div className={`timer ${timeLeft < 300 ? "timer-warn" : "timer-ok"}`}>
                {formatTime(timeLeft)}
              </div>
            ) : (
              <span style={{ color: "var(--text-dim)", fontSize: 13 }}>Review Mode</span>
            )}
          </div>

          {/* Question */}
          <div className="question-area" key={currentQ}>
            <h2 className="question-text">{q.question}</h2>
            {q.type === "multi" && <div className="question-hint">Select all that apply</div>}

            {q.type === "free" ? (
              <div>
                <textarea
                  className="free-textarea"
                  value={answers[q.id] || ""}
                  onChange={(e) => handleSelect(q.id, e.target.value)}
                  placeholder="Type your answer here..."
                  disabled={isReview}
                />
                {isReview && (
                  <div className="explanation-box" style={{ marginTop: 16 }}>
                    <div className="explanation-label">Sample Answer</div>
                    {q.explanation}
                  </div>
                )}
              </div>
            ) : (
              <div className="options-list">
                {q.options.map((opt, idx) => {
                  const selected = (answers[q.id] || []).includes(idx);
                  const isRight = q.answer.includes(idx);
                  let cls = "option-btn";

                  if ((isReview || submitted) && selected && isRight) cls += " correct";
                  else if ((isReview || submitted) && selected && !isRight) cls += " incorrect";
                  else if ((isReview || submitted) && !selected && isRight) cls += " missed";
                  else if (selected) cls += " selected";

                  return (
                    <button
                      key={idx}
                      className={cls}
                      onClick={() => handleSelect(q.id, idx)}
                      disabled={isReview || submitted}
                    >
                      <div className={`${q.type === "multi" ? "checkbox" : "radio"} ${selected ? "checked" : ""}`}>
                        {selected && <span className="check-mark">✓</span>}
                      </div>
                      {opt}
                    </button>
                  );
                })}
              </div>
            )}

            {isReview && q.type !== "free" && (
              <div>
                <button
                  className="explanation-toggle"
                  onClick={() => setShowExplanation((p) => ({ ...p, [q.id]: !p[q.id] }))}
                >
                  {showExplanation[q.id] ? "▾ Hide" : "▸ Show"} Explanation
                </button>
                {showExplanation[q.id] && (
                  <div className="explanation-box">
                    <div className="explanation-label">Explanation</div>
                    {q.explanation}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Footer Navigation */}
          <div className="footer-nav">
            <button
              className="btn-nav btn-prev"
              onClick={() => setCurrentQ((c) => Math.max(0, c - 1))}
              disabled={currentQ === 0}
            >
              ← Prev
            </button>

            <div className="dots-container">
              {QUESTIONS.map((_, i) => (
                <button
                  key={i}
                  className={`dot ${isAnswered(i) ? "dot-answered" : "dot-empty"} ${i === currentQ ? "dot-current" : ""}`}
                  onClick={() => setCurrentQ(i)}
                />
              ))}
            </div>

            {currentQ === QUESTIONS.length - 1 && !isReview && !submitted ? (
              <button className="btn-submit" onClick={handleSubmit}>Submit</button>
            ) : (
              <button
                className="btn-nav btn-next"
                onClick={() => setCurrentQ((c) => Math.min(QUESTIONS.length - 1, c + 1))}
                disabled={currentQ === QUESTIONS.length - 1}
              >
                Next →
              </button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
