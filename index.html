<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS 3365 – Exam 1 Practice</title>
  <meta name="description" content="Interactive practice quiz for CS 3365 Software Engineering Exam 1 — Chapters 1-4 with randomized questions" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📝</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="questions.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050510;
      --bg2: #0c0c24;
      --surface: rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.065);
      --surface-active: rgba(255,255,255,0.09);
      --accent: #818cf8;
      --accent-dim: rgba(129,140,248,0.15);
      --accent-glow: rgba(129,140,248,0.3);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.12);
      --green-b: rgba(52,211,153,0.45);
      --red: #fb7185;
      --red-dim: rgba(251,113,133,0.12);
      --red-b: rgba(251,113,133,0.45);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
      --text: #e2e4f0;
      --text2: rgba(255,255,255,0.55);
      --text3: rgba(255,255,255,0.3);
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --font: 'Outfit', -apple-system, sans-serif;
      --mono: 'Fira Code', monospace;
      --radius: 14px;
      --radius-sm: 10px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }

    /* Ambient background */
    .ambient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 15% 10%, rgba(129,140,248,0.07), transparent 65%),
        radial-gradient(ellipse 50% 40% at 85% 90%, rgba(167,139,250,0.05), transparent 55%),
        radial-gradient(ellipse 80% 80% at 50% 50%, rgba(6,6,20,1), transparent);
    }

    .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ───── Start ───── */
    .start { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }

    .start-card {
      max-width: 560px; width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 56px 48px;
      text-align: center;
      backdrop-filter: blur(20px);
      animation: rise 0.5s ease-out;
    }
    @keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }

    .tag { font-size:11px; letter-spacing:5px; color:var(--accent); text-transform:uppercase; font-weight:700; margin-bottom:14px; }
    .start-card h1 { font-size:36px; font-weight:900; color:#fff; line-height:1.15; }
    .start-card .sub { color:var(--text2); font-size:15px; margin-top:6px; margin-bottom:36px; }

    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px; }
    .g-box { background:rgba(255,255,255,0.025); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px 10px; }
    .g-val { font-family:var(--mono); color:var(--accent); font-size:26px; font-weight:700; }
    .g-lbl { color:var(--text3); font-size:10px; margin-top:5px; text-transform:uppercase; letter-spacing:1.5px; }

    .info-box {
      background: var(--accent-dim); border:1px solid rgba(129,140,248,0.18);
      border-radius: var(--radius-sm); padding:16px 20px; margin-bottom:32px; text-align:left;
    }
    .info-box strong { color:var(--accent); font-size:13px; display:block; margin-bottom:4px; }
    .info-box p { color:var(--text2); font-size:13px; line-height:1.65; }

    .btn {
      font-family:var(--font); border:none; border-radius:var(--radius-sm);
      padding:14px 48px; font-size:16px; font-weight:700; cursor:pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn:hover { transform:translateY(-1px); }
    .btn:active { transform:translateY(0); }
    .btn-accent { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
    .btn-accent:hover { box-shadow:0 8px 28px var(--accent-glow); }
    .btn-green { background:linear-gradient(135deg,#34d399,#10b981); color:#000; font-weight:800; }
    .btn-ghost { background:var(--surface); color:var(--text); }

    /* ───── Header ───── */
    .hdr {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 20px; border-bottom:1px solid var(--border);
      background:rgba(5,5,16,0.88); backdrop-filter:blur(14px);
      position:sticky; top:0; z-index:20;
    }
    .hdr-l { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .hdr .cnt { font-family:var(--mono); color:var(--text2); font-size:13px; }
    .pill { font-size:10px; padding:3px 10px; border-radius:20px; font-weight:700; white-space:nowrap; }
    .pill-prof { background:var(--amber-dim); color:var(--amber); }
    .pill-ch { background:var(--accent-dim); color:var(--accent); }
    .pill-type { background:rgba(52,211,153,0.1); color:var(--green); }
    .timer { font-family:var(--mono); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums; }
    .timer-ok { color:var(--accent); }
    .timer-warn { color:var(--red); animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

    /* ───── Question ───── */
    .q-wrap { flex:1; padding:36px 20px; max-width:740px; margin:0 auto; width:100%; }
    .q-text { font-size:20px; font-weight:700; line-height:1.55; color:#fff; margin-bottom:4px; }
    .q-hint { color:var(--accent); font-size:13px; font-weight:500; margin-bottom:18px; }

    .opts { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
    .opt {
      display:flex; align-items:flex-start; gap:14px; width:100%;
      background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius-sm); padding:15px 18px;
      color:var(--text); font-size:15px; line-height:1.5; text-align:left;
      cursor:pointer; transition:all 0.12s; font-family:var(--font);
    }
    .opt:not(:disabled):hover { background:var(--surface-hover); border-color:rgba(255,255,255,0.18); }
    .opt:disabled { cursor:default; }
    .opt.sel { background:var(--accent-dim); border-color:rgba(129,140,248,0.5); }
    .opt.ok { background:var(--green-dim); border-color:var(--green-b); }
    .opt.bad { background:var(--red-dim); border-color:var(--red-b); }
    .opt.miss { background:rgba(52,211,153,0.04); border-color:rgba(52,211,153,0.2); }

    .ind {
      width:22px; height:22px; flex-shrink:0; margin-top:1px;
      border:2px solid var(--text3); display:flex; align-items:center;
      justify-content:center; transition:all 0.12s;
    }
    .ind-r { border-radius:50%; }
    .ind-c { border-radius:5px; }
    .ind.on { background:var(--accent); border-color:var(--accent); }
    .chk { color:#fff; font-size:11px; font-weight:800; }

    /* Fill-in-the-blank */
    .fill-wrap { margin-top:18px; }
    .fill-input {
      width:100%; padding:16px 18px; font-size:16px; font-family:var(--font);
      background:var(--surface); border:1px solid var(--border2); border-radius:var(--radius-sm);
      color:var(--text); outline:none; transition:border-color 0.2s;
    }
    .fill-input:focus { border-color:rgba(129,140,248,0.5); }
    .fill-input:disabled { opacity:0.6; }
    .fill-input.fill-ok { border-color:var(--green-b); background:var(--green-dim); }
    .fill-input.fill-bad { border-color:var(--red-b); background:var(--red-dim); }
    .fill-hint { margin-top:8px; font-size:13px; color:var(--text3); }
    .fill-answer { margin-top:10px; font-size:14px; padding:10px 14px; border-radius:8px; }
    .fill-answer.fill-ok-box { background:var(--green-dim); color:var(--green); }
    .fill-answer.fill-bad-box { background:var(--red-dim); color:var(--red); }

    /* Free response */
    .free-ta {
      width:100%; min-height:200px; padding:18px; font-size:15px; line-height:1.7;
      font-family:var(--font); background:var(--surface); border:1px solid var(--border2);
      border-radius:var(--radius-sm); color:var(--text); resize:vertical; outline:none;
      margin-top:16px; transition:border-color 0.2s;
    }
    .free-ta:focus { border-color:rgba(129,140,248,0.5); }
    .free-ta:disabled { opacity:0.6; }

    /* Explanation */
    .exp-toggle { background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; font-family:var(--font); font-weight:600; padding:0; margin-top:20px; }
    .exp-box {
      margin-top:12px; background:var(--accent-dim); border:1px solid rgba(129,140,248,0.18);
      border-radius:var(--radius-sm); padding:18px 22px; color:rgba(255,255,255,0.75);
      font-size:14px; line-height:1.7; animation:rise 0.2s ease;
    }
    .exp-box .exp-lbl { color:var(--accent); font-weight:700; font-size:12px; margin-bottom:8px; text-transform:uppercase; letter-spacing:1.5px; }

    /* ───── Footer ───── */
    .ftr {
      padding:12px 20px; border-top:1px solid var(--border);
      background:rgba(5,5,16,0.88); backdrop-filter:blur(14px);
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; bottom:0; z-index:20;
    }
    .ftr-btn {
      border:none; border-radius:8px; padding:10px 26px; font-size:14px;
      font-weight:600; cursor:pointer; font-family:var(--font); transition:all 0.12s;
    }
    .ftr-prev { background:rgba(255,255,255,0.06); color:var(--text); }
    .ftr-prev:disabled { color:var(--text3); cursor:default; }
    .ftr-next { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
    .ftr-next:disabled { background:rgba(255,255,255,0.06); color:var(--text3); cursor:default; }

    .dots { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:440px; }
    .dot {
      width:13px; height:13px; border-radius:3px; border:none; padding:0;
      cursor:pointer; transition:all 0.1s;
    }
    .dot-e { background:rgba(255,255,255,0.1); }
    .dot-a { background:var(--accent); }
    .dot-cur { outline:2px solid var(--accent); outline-offset:2px; }

    /* ───── Results ───── */
    .results { padding:40px 20px; max-width:740px; margin:0 auto; width:100%; animation:rise 0.5s ease; }
    .res-hero {
      text-align:center; background:var(--surface); border:1px solid var(--border);
      border-radius:24px; padding:52px 36px; margin-bottom:24px;
    }
    .res-pct { font-family:var(--mono); font-size:80px; font-weight:900; line-height:1; }
    .res-pct.hi { color:var(--green); }
    .res-pct.mid { color:var(--amber); }
    .res-pct.lo { color:var(--red); }
    .res-det { color:var(--text2); font-size:15px; margin-top:10px; }
    .res-btns { display:flex; gap:12px; justify-content:center; margin-top:28px; flex-wrap:wrap; }

    .ch-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
    .ch-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
    .ch-lbl { color:var(--text3); font-size:11px; text-transform:uppercase; letter-spacing:1.5px; }
    .ch-score { font-family:var(--mono); color:#fff; font-size:24px; font-weight:700; margin-top:6px; }
    .ch-bar { height:4px; background:rgba(255,255,255,0.06); border-radius:2px; margin-top:10px; overflow:hidden; }
    .ch-fill { height:100%; border-radius:2px; transition:width 0.8s ease; }

    .shuffle-note {
      text-align:center; color:var(--text3); font-size:13px; margin-top:16px; padding-bottom:32px;
    }

    /* responsive */
    @media(max-width:600px) {
      .start-card { padding:36px 22px; }
      .start-card h1 { font-size:28px; }
      .grid3 { grid-template-columns:1fr; }
      .q-text { font-size:17px; }
      .hdr,.ftr { padding:10px 14px; }
      .q-wrap { padding:24px 14px; }
      .dots { max-width:260px; }
      .ch-grid { grid-template-columns:1fr; }
      .res-pct { font-size:60px; }
      .res-btns { flex-direction:column; align-items:center; }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ═══════════════════════════════════════
    //  QUIZ ENGINE — Shuffle & Select
    // ═══════════════════════════════════════

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildExam(bank) {
      // Always include professor questions and free response
      const profQs = bank.filter(q => q.fromProfessor);
      const freeQs = bank.filter(q => q.type === "free");
      const pool = bank.filter(q => !q.fromProfessor && q.type !== "free");

      // Target: 37 MC (8 prof + 29 from pool) + 2 free = 39 total
      // Balance by chapter and type
      const byChapter = { 1: [], 2: [], 3: [], 4: [] };
      pool.forEach(q => { if (byChapter[q.chapter]) byChapter[q.chapter].push(q); });

      // Shuffle each chapter pool
      Object.keys(byChapter).forEach(k => { byChapter[k] = shuffle(byChapter[k]); });

      // Pick ~7-8 from each chapter to get 29 total
      const targets = { 1: 7, 2: 8, 3: 7, 4: 7 };
      let selected = [];
      Object.entries(targets).forEach(([ch, count]) => {
        const available = byChapter[ch];
        // Ensure a mix of types
        const fills = available.filter(q => q.type === "fill");
        const others = available.filter(q => q.type !== "fill");

        // Include at least 1-2 fill-in-the-blank per chapter if available
        const fillCount = Math.min(fills.length, Math.floor(count * 0.25) + 1);
        const otherCount = count - fillCount;

        selected.push(...fills.slice(0, fillCount));
        selected.push(...others.slice(0, otherCount));
      });

      // Trim to exactly 29 if over
      selected = selected.slice(0, 29);

      // Combine: prof first (shuffled among themselves), then pool (shuffled), then free
      const mcQuestions = [...shuffle(profQs), ...shuffle(selected)];
      return [...mcQuestions, ...freeQs];
    }

    // ═══════════════════════════════════════
    //  FILL-IN-THE-BLANK GRADING
    // ═══════════════════════════════════════

    function gradeFill(question, userInput) {
      if (!userInput || !userInput.trim()) return false;
      const input = userInput.trim().toLowerCase();

      // Check multi-blank (comma separated or space separated)
      if (question.acceptableAnswers) {
        return question.acceptableAnswers.some(acceptable => {
          // Each acceptable is an array of required words
          if (acceptable.length === 1) {
            return input.includes(acceptable[0].toLowerCase());
          }
          // Multi-blank: check all words present
          return acceptable.every(word => input.includes(word.toLowerCase()));
        });
      }

      // Fallback: simple match
      return question.answer.some(a => input.includes(a.toLowerCase()));
    }

    // ═══════════════════════════════════════
    //  MAIN APP
    // ═══════════════════════════════════════

    const TOTAL_TIME = 60 * 60;

    function App() {
      const [screen, setScreen] = useState("start");
      const [questions, setQuestions] = useState([]);
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState({});
      const [showExp, setShowExp] = useState({});
      const [timeLeft, setTimeLeft] = useState(TOTAL_TIME);
      const [timerOn, setTimerOn] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const timerRef = useRef(null);

      useEffect(() => {
        if (timerOn && timeLeft > 0) {
          timerRef.current = setInterval(() => {
            setTimeLeft(t => {
              if (t <= 1) { clearInterval(timerRef.current); setSubmitted(true); setScreen("results"); return 0; }
              return t - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [timerOn]);

      const fmt = s => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,"0")}`;

      const startExam = () => {
        const exam = buildExam(window.QUESTION_BANK);
        setQuestions(exam);
        setAnswers({});
        setShowExp({});
        setTimeLeft(TOTAL_TIME);
        setSubmitted(false);
        setCurrentQ(0);
        setScreen("exam");
        setTimerOn(true);
      };

      const handleSelect = useCallback((qId, val) => {
        if (submitted) return;
        const q = questions.find(q => q.id === qId);
        if (!q) return;
        if (q.type === "free" || q.type === "fill") {
          setAnswers(p => ({ ...p, [qId]: val }));
          return;
        }
        if (q.type === "multi") {
          setAnswers(p => {
            const cur = p[qId] || [];
            const upd = cur.includes(val) ? cur.filter(i => i !== val) : [...cur, val];
            return { ...p, [qId]: upd };
          });
        } else {
          setAnswers(p => ({ ...p, [qId]: [val] }));
        }
      }, [submitted, questions]);

      const isCorrect = useCallback((qId) => {
        const q = questions.find(q => q.id === qId);
        if (!q) return null;
        if (q.type === "free") return null;
        if (q.type === "fill") return gradeFill(q, answers[qId]);
        const ua = answers[qId] || [];
        if (ua.length !== q.answer.length) return false;
        return q.answer.every(a => ua.includes(a)) && ua.every(a => q.answer.includes(a));
      }, [answers, questions]);

      const score = useMemo(() => {
        let correct = 0, total = 0;
        questions.forEach(q => {
          if (q.type !== "free") { total++; if (isCorrect(q.id)) correct++; }
        });
        return { correct, total };
      }, [questions, isCorrect]);

      const handleSubmit = () => {
        if (!confirm("Submit your exam? You won't be able to change answers.")) return;
        setSubmitted(true); setTimerOn(false); clearInterval(timerRef.current); setScreen("results");
      };

      const q = questions[currentQ];
      const pct = score.total > 0 ? Math.round((score.correct / score.total) * 100) : 0;
      const isReview = screen === "review";

      // ── Start ──
      if (screen === "start") {
        return (
          <div className="app">
            <div className="start">
              <div className="start-card">
                <div className="tag">CS 3365 · Software Engineering</div>
                <h1>Exam 1 Practice</h1>
                <p className="sub">Chapters 1 – 4 · Randomized each attempt</p>
                <div className="grid3">
                  <div className="g-box"><div className="g-val">39</div><div className="g-lbl">Questions</div></div>
                  <div className="g-box"><div className="g-val">60m</div><div className="g-lbl">Time Limit</div></div>
                  <div className="g-box"><div className="g-val">4</div><div className="g-lbl">Question Types</div></div>
                </div>
                <div className="info-box">
                  <strong>How it works</strong>
                  <p>
                    Your professor's 8 confirmed questions are always included. The remaining 29 MC questions are randomly
                    drawn from a bank of 60+ questions — you'll get a different mix every time. Includes multiple choice,
                    select-all-that-apply, fill-in-the-blank, and 2 free response questions.
                  </p>
                </div>
                <button className="btn btn-accent" onClick={startExam}>Start Exam</button>
              </div>
            </div>
          </div>
        );
      }

      // ── Results ──
      if (screen === "results") {
        return (
          <div className="app">
            <div className="results">
              <div className="res-hero">
                <div className="tag" style={{marginBottom:16}}>Final Score</div>
                <div className={`res-pct ${pct >= 70 ? "hi" : pct >= 50 ? "mid" : "lo"}`}>{pct}%</div>
                <div className="res-det">{score.correct} / {score.total} scored questions correct</div>
                <div className="res-btns">
                  <button className="btn btn-accent" onClick={() => { setScreen("review"); setCurrentQ(0); }}>Review Answers</button>
                  <button className="btn btn-ghost" onClick={startExam}>New Attempt</button>
                </div>
              </div>
              <div className="ch-grid">
                {[1,2,3,4].map(ch => {
                  const chQs = questions.filter(q => q.chapter === ch && q.type !== "free");
                  const chOk = chQs.filter(q => isCorrect(q.id)).length;
                  const chPct = chQs.length > 0 ? (chOk/chQs.length)*100 : 0;
                  return (
                    <div key={ch} className="ch-box">
                      <div className="ch-lbl">Chapter {ch}</div>
                      <div className="ch-score">{chOk}/{chQs.length}</div>
                      <div className="ch-bar"><div className="ch-fill" style={{width:`${chPct}%`, background: chPct >= 70 ? "var(--green)" : chPct >= 50 ? "var(--amber)" : "var(--red)"}} /></div>
                    </div>
                  );
                })}
              </div>
              <div className="shuffle-note">Questions are randomized — retake for a different set!</div>
            </div>
          </div>
        );
      }

      if (!q) return null;

      const isAnswered = (idx) => {
        const qq = questions[idx]; if (!qq) return false;
        const a = answers[qq.id];
        if (qq.type === "free" || qq.type === "fill") return a && a.length > 0;
        return a && a.length > 0;
      };

      const typeLabel = { single: "Multiple Choice", multi: "Select All", fill: "Fill in the Blank", free: "Free Response" };

      return (
        <div className="app">
          {/* Header */}
          <div className="hdr">
            <div className="hdr-l">
              <span className="cnt">Q{currentQ+1}/{questions.length}</span>
              {q.fromProfessor && <span className="pill pill-prof">⭐ PROFESSOR</span>}
              <span className="pill pill-ch">Ch. {q.chapter}</span>
              <span className="pill pill-type">{typeLabel[q.type]}</span>
            </div>
            {!isReview ? (
              <div className={`timer ${timeLeft < 300 ? "timer-warn" : "timer-ok"}`}>{fmt(timeLeft)}</div>
            ) : (
              <span style={{color:"var(--text2)", fontSize:13}}>Review Mode</span>
            )}
          </div>

          {/* Question body */}
          <div className="q-wrap" key={`${q.id}-${currentQ}`}>
            <h2 className="q-text">{q.question}</h2>
            {q.type === "multi" && <div className="q-hint">Select all that apply</div>}
            {q.type === "fill" && !isReview && !submitted && <div className="q-hint">Type your answer below</div>}

            {/* ── Fill in the blank ── */}
            {q.type === "fill" && (
              <div className="fill-wrap">
                <input
                  type="text"
                  className={`fill-input ${(isReview || submitted) ? (isCorrect(q.id) ? "fill-ok" : "fill-bad") : ""}`}
                  value={answers[q.id] || ""}
                  onChange={e => handleSelect(q.id, e.target.value)}
                  placeholder="Type your answer..."
                  disabled={isReview || submitted}
                  autoComplete="off"
                />
                {(isReview || submitted) && (
                  <div className={`fill-answer ${isCorrect(q.id) ? "fill-ok-box" : "fill-bad-box"}`}>
                    {isCorrect(q.id) ? "✓ Correct!" : `✗ Correct answer: ${q.answer.join(", ")}`}
                  </div>
                )}
              </div>
            )}

            {/* ── Free response ── */}
            {q.type === "free" && (
              <div>
                <textarea
                  className="free-ta"
                  value={answers[q.id] || ""}
                  onChange={e => handleSelect(q.id, e.target.value)}
                  placeholder="Type your answer here..."
                  disabled={isReview}
                />
                {isReview && (
                  <div className="exp-box" style={{marginTop:16}}>
                    <div className="exp-lbl">Sample Answer</div>
                    {q.explanation}
                  </div>
                )}
              </div>
            )}

            {/* ── MC / Multi ── */}
            {(q.type === "single" || q.type === "multi") && (
              <div className="opts">
                {q.options.map((opt, idx) => {
                  const selected = (answers[q.id] || []).includes(idx);
                  const isRight = q.answer.includes(idx);
                  let cls = "opt";
                  if ((isReview || submitted) && selected && isRight) cls += " ok";
                  else if ((isReview || submitted) && selected && !isRight) cls += " bad";
                  else if ((isReview || submitted) && !selected && isRight) cls += " miss";
                  else if (selected) cls += " sel";

                  return (
                    <button key={idx} className={cls} onClick={() => handleSelect(q.id, idx)} disabled={isReview || submitted}>
                      <div className={`ind ${q.type === "multi" ? "ind-c" : "ind-r"} ${selected ? "on" : ""}`}>
                        {selected && <span className="chk">✓</span>}
                      </div>
                      {opt}
                    </button>
                  );
                })}
              </div>
            )}

            {/* Explanation */}
            {(isReview || submitted) && q.type !== "free" && (
              <div>
                <button className="exp-toggle" onClick={() => setShowExp(p => ({...p, [q.id]: !p[q.id]}))}>
                  {showExp[q.id] ? "▾ Hide" : "▸ Show"} Explanation
                </button>
                {showExp[q.id] && (
                  <div className="exp-box">
                    <div className="exp-lbl">Explanation</div>
                    {q.explanation}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Footer */}
          <div className="ftr">
            <button className="ftr-btn ftr-prev" onClick={() => setCurrentQ(c => Math.max(0, c-1))} disabled={currentQ === 0}>← Prev</button>
            <div className="dots">
              {questions.map((_, i) => (
                <button key={i} className={`dot ${isAnswered(i) ? "dot-a" : "dot-e"} ${i === currentQ ? "dot-cur" : ""}`} onClick={() => setCurrentQ(i)} />
              ))}
            </div>
            {currentQ === questions.length - 1 && !isReview && !submitted ? (
              <button className="btn btn-green" style={{padding:"10px 26px", fontSize:14}} onClick={handleSubmit}>Submit</button>
            ) : (
              <button className="ftr-btn ftr-next" onClick={() => setCurrentQ(c => Math.min(questions.length-1, c+1))} disabled={currentQ === questions.length-1}>Next →</button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
