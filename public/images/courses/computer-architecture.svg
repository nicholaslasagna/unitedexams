<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Computer Architecture — 5-stage pipeline">
  <defs>
    <style>
      .ca-stroke { stroke: #c4b5fd; stroke-opacity: 0.85; stroke-width: 1.4; }
      .ca-stroke-soft { stroke: #c4b5fd; stroke-opacity: 0.5; stroke-width: 0.9; }
      .ca-fill { fill: #160a36; }
      .ca-text { fill: #ede9fe; font-family: ui-serif, Georgia, "Times New Roman", serif; }
      .ca-mono { fill: #c4b5fd; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; letter-spacing: 0.06em; fill-opacity: 0.7; }
      .ca-italic { font-style: italic; }
    </style>
    <marker id="ca-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <!-- Solid ink background -->
  <rect width="440" height="280" rx="22" fill="#0f0824"/>

  <!--
    5-stage RISC pipeline laid out horizontally.
    Single accent (violet). Hairline strokes. Serif stage labels.
    Reads as a real datapath sketch from a textbook (Patterson/Hennessy).

    Above: a subtle "instruction word" mnemonic (label + imm)
    Below: a register-write-back loopback line.
  -->

  <!-- Top annotation: an instruction stream label -->
  <text x="32" y="58" class="ca-mono ca-italic">instruction stream</text>
  <line x1="32" y1="64" x2="120" y2="64" class="ca-stroke-soft"/>

  <!-- Pipeline stages — 5 boxes, hairline, calm -->
  <g transform="translate(28 110)">
    <!-- IF -->
    <rect x="0" y="0" width="68" height="60" rx="3" class="ca-fill ca-stroke"/>
    <text x="34" y="32" text-anchor="middle" class="ca-text" font-size="14" font-weight="700">IF</text>
    <text x="34" y="48" text-anchor="middle" class="ca-mono">fetch</text>

    <!-- arrow -->
    <line x1="70" y1="30" x2="82" y2="30" class="ca-stroke" marker-end="url(#ca-arrow)"/>

    <!-- ID -->
    <rect x="84" y="0" width="68" height="60" rx="3" class="ca-fill ca-stroke"/>
    <text x="118" y="32" text-anchor="middle" class="ca-text" font-size="14" font-weight="700">ID</text>
    <text x="118" y="48" text-anchor="middle" class="ca-mono">decode</text>

    <line x1="154" y1="30" x2="166" y2="30" class="ca-stroke" marker-end="url(#ca-arrow)"/>

    <!-- EX -->
    <rect x="168" y="0" width="68" height="60" rx="3" class="ca-fill ca-stroke"/>
    <text x="202" y="32" text-anchor="middle" class="ca-text" font-size="14" font-weight="700">EX</text>
    <text x="202" y="48" text-anchor="middle" class="ca-mono">execute</text>

    <line x1="238" y1="30" x2="250" y2="30" class="ca-stroke" marker-end="url(#ca-arrow)"/>

    <!-- MEM -->
    <rect x="252" y="0" width="68" height="60" rx="3" class="ca-fill ca-stroke"/>
    <text x="286" y="32" text-anchor="middle" class="ca-text" font-size="14" font-weight="700">MEM</text>
    <text x="286" y="48" text-anchor="middle" class="ca-mono">memory</text>

    <line x1="322" y1="30" x2="334" y2="30" class="ca-stroke" marker-end="url(#ca-arrow)"/>

    <!-- WB -->
    <rect x="336" y="0" width="48" height="60" rx="3" class="ca-fill ca-stroke"/>
    <text x="360" y="32" text-anchor="middle" class="ca-text" font-size="14" font-weight="700">WB</text>
    <text x="360" y="48" text-anchor="middle" class="ca-mono">writeback</text>
  </g>

  <!--
    Forwarding bypass — the iconic "EX/MEM → ALU input" line that gives
    the diagram its character. Drawn as a soft curve under the boxes.
  -->
  <path
    d="M 314 195 Q 314 222, 240 222 Q 196 222, 196 195"
    fill="none" class="ca-stroke-soft" stroke-dasharray="3 4"
  />
  <text x="234" y="237" text-anchor="middle" class="ca-text ca-italic" font-size="10" fill="#c4b5fd" fill-opacity="0.7">forwarding</text>

  <!-- Quiet figure label -->
  <text x="412" y="22" text-anchor="end" class="ca-text ca-italic" font-size="9" fill-opacity="0.45">fig. 3</text>
</svg>
