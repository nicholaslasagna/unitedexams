<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="United Exams course">
  <defs>
    <linearGradient id="def-bg" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="def-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="def-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.85" fill="#fbbf24" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="def-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" rx="22" fill="url(#def-bg)"/>
  <rect width="440" height="280" rx="22" fill="url(#def-dots)"/>
  <rect width="440" height="280" rx="22" fill="url(#def-glow)"/>

  <!-- Centered editorial mark: open book + small accent constellation -->
  <g transform="translate(220 140)">
    <!-- Soft halo -->
    <circle r="78" fill="none" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle r="58" fill="none" stroke="#fbbf24" stroke-opacity="0.12" stroke-width="0.6"/>

    <!-- Open book -->
    <g>
      <!-- left page -->
      <path d="M -52 -22 L -4 -28 L -4 26 L -52 30 Z" fill="#1e293b" stroke="url(#def-mark)" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- right page -->
      <path d="M 4 -28 L 52 -22 L 52 30 L 4 26 Z" fill="#1e293b" stroke="url(#def-mark)" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- spine highlight -->
      <line x1="0" y1="-26" x2="0" y2="28" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1"/>

      <!-- text-line marks on left page -->
      <g stroke="#fde68a" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round">
        <line x1="-44" y1="-12" x2="-12" y2="-15"/>
        <line x1="-44" y1="-4" x2="-18" y2="-7"/>
        <line x1="-44" y1="4" x2="-14" y2="1"/>
        <line x1="-44" y1="12" x2="-22" y2="9"/>
      </g>
      <!-- text-line marks on right page -->
      <g stroke="#fde68a" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round">
        <line x1="12" y1="-15" x2="44" y2="-12"/>
        <line x1="18" y1="-7" x2="44" y2="-4"/>
        <line x1="14" y1="1" x2="44" y2="4"/>
        <line x1="22" y1="9" x2="44" y2="12"/>
      </g>
    </g>

    <!-- Tiny constellation dots above the book -->
    <g fill="#fbbf24">
      <circle cx="-30" cy="-58" r="1.4"/>
      <circle cx="0" cy="-66" r="1.8"/>
      <circle cx="28" cy="-56" r="1.4"/>
    </g>
    <g stroke="#fbbf24" stroke-opacity="0.45" stroke-width="0.7">
      <line x1="-30" y1="-58" x2="0" y2="-66"/>
      <line x1="0" y1="-66" x2="28" y2="-56"/>
    </g>
  </g>

  <!-- Corner editorial marks -->
  <g stroke="#fbbf24" stroke-opacity="0.35" stroke-width="0.9" stroke-linecap="round" fill="none">
    <path d="M 24 24 l 14 0"/>
    <path d="M 24 24 l 0 14"/>
    <path d="M 416 24 l -14 0"/>
    <path d="M 416 24 l 0 14"/>
    <path d="M 24 256 l 14 0"/>
    <path d="M 24 256 l 0 -14"/>
    <path d="M 416 256 l -14 0"/>
    <path d="M 416 256 l 0 -14"/>
  </g>
</svg>
