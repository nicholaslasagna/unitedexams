<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Differential Equations — phase portrait">
  <defs>
    <linearGradient id="de-bg" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1444"/>
      <stop offset="0.55" stop-color="#101a52"/>
      <stop offset="1" stop-color="#050a26"/>
    </linearGradient>
    <radialGradient id="de-glow" cx="0.55" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="de-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.85" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="de-traj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="de-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a5b4fc" fill-opacity="0.55"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" rx="22" fill="url(#de-bg)"/>
  <rect width="440" height="280" rx="22" fill="url(#de-dots)"/>
  <rect width="440" height="280" rx="22" fill="url(#de-glow)"/>

  <!-- Implied axes (very subtle, hand-drawn jitter) -->
  <g stroke="#a5b4fc" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round">
    <path d="M 32 140 L 408 140" stroke-dasharray="0,0"/>
    <path d="M 220 30 L 220 250" stroke-dasharray="0,0"/>
  </g>
  <!-- axis tick marks -->
  <g stroke="#c7d2fe" stroke-opacity="0.35" stroke-width="1">
    <line x1="100" y1="137" x2="100" y2="143"/>
    <line x1="160" y1="137" x2="160" y2="143"/>
    <line x1="280" y1="137" x2="280" y2="143"/>
    <line x1="340" y1="137" x2="340" y2="143"/>
    <line x1="217" y1="80" x2="223" y2="80"/>
    <line x1="217" y1="200" x2="223" y2="200"/>
  </g>

  <!-- Vector field: tiny arrows showing flow direction (sparse, atmospheric) -->
  <g stroke="#7dd3fc" stroke-opacity="0.32" stroke-width="0.9" stroke-linecap="round" fill="none">
    <!-- Each line ends with a tiny arrowhead via marker -->
    <line x1="62" y1="58" x2="74" y2="68" marker-end="url(#de-arrow)"/>
    <line x1="100" y1="48" x2="114" y2="60" marker-end="url(#de-arrow)"/>
    <line x1="356" y1="48" x2="370" y2="60" marker-end="url(#de-arrow)"/>
    <line x1="62" y1="220" x2="74" y2="208" marker-end="url(#de-arrow)"/>
    <line x1="372" y1="222" x2="386" y2="210" marker-end="url(#de-arrow)"/>
    <line x1="116" y1="228" x2="130" y2="216" marker-end="url(#de-arrow)"/>
    <line x1="320" y1="228" x2="334" y2="216" marker-end="url(#de-arrow)"/>
    <line x1="48" y1="138" x2="64" y2="138" marker-end="url(#de-arrow)"/>
    <line x1="380" y1="138" x2="396" y2="138" marker-end="url(#de-arrow)"/>
  </g>

  <!-- Outer trajectory — wide ellipse spiraling in -->
  <path d="M 388 140
           C 388 70, 308 38, 220 38
           C 132 38, 52 70, 52 140
           C 52 210, 132 242, 220 242
           C 308 242, 380 214, 380 156"
        fill="none" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Middle trajectory -->
  <path d="M 350 140
           C 350 88, 290 64, 220 64
           C 150 64, 90 92, 90 140
           C 90 188, 150 216, 220 216
           C 290 216, 344 198, 344 152"
        fill="none" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Inner trajectory — the highlighted one, accent color -->
  <path d="M 308 140
           C 308 108, 270 90, 220 90
           C 170 90, 132 110, 132 140
           C 132 170, 170 188, 220 188
           C 270 188, 304 174, 304 150"
        fill="none" stroke="url(#de-traj)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Innermost spiral -->
  <path d="M 270 140
           C 270 122, 250 112, 226 112
           C 202 112, 184 124, 184 142
           C 184 158, 200 168, 222 168
           C 240 168, 254 162, 256 152"
        fill="none" stroke="#c7d2fe" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Direction arrowheads on the highlighted trajectory -->
  <g fill="#a5b4fc">
    <path d="M 308 132 l -7 -3 l 1 6 z"/>
    <path d="M 132 148 l 7 3 l -1 -6 z"/>
  </g>

  <!-- Equilibrium point at the origin -->
  <g>
    <circle cx="220" cy="140" r="8" fill="#0c1444" stroke="#67e8f9" stroke-width="1.4"/>
    <circle cx="220" cy="140" r="3.5" fill="#67e8f9"/>
    <circle cx="220" cy="140" r="3.5" fill="none" stroke="#67e8f9" stroke-opacity="0.6" stroke-width="1">
      <animate attributeName="r" from="3.5" to="11" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.6" to="0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle hand-drawn corner notation (no readable text — just a mark) -->
  <g fill="none" stroke="#c7d2fe" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round">
    <path d="M 24 254 q 4 -8 10 -8 q 6 0 6 6 q 0 4 -3 6"/>
    <path d="M 42 254 l 8 -10"/>
    <path d="M 42 244 l 8 10"/>
  </g>
</svg>
