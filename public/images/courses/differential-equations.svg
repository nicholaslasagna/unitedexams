<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Differential Equations — phase portrait">
  <defs>
    <style>
      .de-axis { stroke: #c7d2fe; stroke-opacity: 0.4; stroke-width: 1; }
      .de-tick { stroke: #c7d2fe; stroke-opacity: 0.45; stroke-width: 1; }
      .de-traj { stroke: #818cf8; fill: none; stroke-linecap: round; }
      .de-text { fill: #e0e7ff; font-family: ui-serif, Georgia, "Times New Roman", serif; font-style: italic; }
    </style>
  </defs>

  <!-- Solid ink background — no gradient, no glow -->
  <rect width="440" height="280" rx="22" fill="#0c1130"/>

  <!--
    Real coordinate axes with tick marks. Origin at center.
    Two trajectories spiraling toward the origin (stable focus).
    No vector field, no pulsing dot. Just the math.
  -->

  <!-- Axes -->
  <line x1="40" y1="140" x2="400" y2="140" class="de-axis"/>
  <line x1="220" y1="32" x2="220" y2="248" class="de-axis"/>

  <!-- Axis labels at the ends — italic serif, classical math style -->
  <text x="408" y="143" class="de-text" font-size="13">x</text>
  <text x="220" y="26" text-anchor="middle" class="de-text" font-size="13">y</text>

  <!-- Tick marks at 1, 2 unit intervals -->
  <g class="de-tick">
    <line x1="160" y1="137" x2="160" y2="143"/>
    <line x1="100" y1="137" x2="100" y2="143"/>
    <line x1="280" y1="137" x2="280" y2="143"/>
    <line x1="340" y1="137" x2="340" y2="143"/>
    <line x1="217" y1="80" x2="223" y2="80"/>
    <line x1="217" y1="200" x2="223" y2="200"/>
  </g>

  <!-- Outer trajectory (lighter) -->
  <path
    d="M 380 140
       C 380 70, 296 38, 220 38
       C 144 38, 60 70, 60 140
       C 60 210, 144 242, 220 242
       C 296 242, 372 214, 372 158"
    class="de-traj"
    stroke-width="1.3"
    stroke-opacity="0.55"
  />

  <!-- Middle trajectory (medium) — the visual anchor -->
  <path
    d="M 332 140
       C 332 90, 280 66, 220 66
       C 160 66, 108 92, 108 140
       C 108 188, 160 214, 220 214
       C 280 214, 326 196, 326 156"
    class="de-traj"
    stroke-width="1.7"
  />

  <!-- Inner trajectory (tighter spiral) -->
  <path
    d="M 280 140
       C 280 110, 252 96, 220 96
       C 188 96, 162 112, 162 140
       C 162 168, 188 184, 220 184
       C 250 184, 270 174, 272 154"
    class="de-traj"
    stroke-width="1.4"
    stroke-opacity="0.85"
  />

  <!-- Equilibrium point — solid dot, no pulse, no halo -->
  <circle cx="220" cy="140" r="4" fill="#c7d2fe"/>

  <!-- Quiet origin label -->
  <text x="232" y="158" class="de-text" font-size="11" fill-opacity="0.7">O</text>

  <!-- Page number style mark -->
  <text x="412" y="266" text-anchor="end" class="de-text" font-size="9" fill-opacity="0.4">fig. 2</text>
</svg>
