<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Software Engineering — UML class diagram">
  <defs>
    <style>
      .se-stroke { stroke: #93c5fd; stroke-opacity: 0.85; }
      .se-stroke-soft { stroke: #93c5fd; stroke-opacity: 0.45; }
      .se-fill { fill: #0c1426; }
      .se-text { fill: #e0e7ff; font-family: ui-serif, Georgia, "Times New Roman", serif; }
      .se-mono { fill: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; letter-spacing: 0.02em; }
      .se-italic { font-style: italic; }
    </style>
    <marker id="se-empty-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0a1020" stroke="#93c5fd" stroke-width="1"/>
    </marker>
    <marker id="se-empty-diamond" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="13" markerHeight="11" orient="auto">
      <path d="M 1 6 L 7 1 L 13 6 L 7 11 z" fill="#0a1020" stroke="#93c5fd" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Solid background -->
  <rect width="440" height="280" rx="22" fill="#0a1020"/>

  <!--
    Three UML classes laid out horizontally so the middle horizontal
    band (which is what the catalog card crop shows) holds the most
    important content. Reads left-to-right:
      User  ──association──>  Order  ──aggregation──>  LineItem
  -->

  <!-- LEFT: User -->
  <g transform="translate(20 96)">
    <rect x="0" y="0" width="110" height="88" rx="2" class="se-fill se-stroke" stroke-width="1.3"/>
    <line x1="0" y1="22" x2="110" y2="22" class="se-stroke" stroke-width="1"/>
    <line x1="0" y1="52" x2="110" y2="52" class="se-stroke-soft" stroke-width="0.8"/>
    <text x="55" y="15" text-anchor="middle" class="se-text" font-size="12" font-weight="700">User</text>
    <text x="6" y="34" class="se-mono">- id: UUID</text>
    <text x="6" y="44" class="se-mono">- email: str</text>
    <text x="6" y="64" class="se-mono">+ login()</text>
    <text x="6" y="74" class="se-mono">+ logout()</text>
  </g>

  <!-- MIDDLE: Order (slightly taller — visual anchor) -->
  <g transform="translate(165 84)">
    <rect x="0" y="0" width="110" height="112" rx="2" class="se-fill se-stroke" stroke-width="1.4"/>
    <line x1="0" y1="22" x2="110" y2="22" class="se-stroke" stroke-width="1"/>
    <line x1="0" y1="62" x2="110" y2="62" class="se-stroke-soft" stroke-width="0.8"/>
    <text x="55" y="15" text-anchor="middle" class="se-text" font-size="12" font-weight="700">Order</text>
    <text x="6" y="34" class="se-mono">- id: UUID</text>
    <text x="6" y="44" class="se-mono">- total: Money</text>
    <text x="6" y="54" class="se-mono">- placedAt: ts</text>
    <text x="6" y="74" class="se-mono">+ submit()</text>
    <text x="6" y="84" class="se-mono">+ cancel()</text>
    <text x="6" y="94" class="se-mono">+ total()</text>
  </g>

  <!-- RIGHT: LineItem -->
  <g transform="translate(310 96)">
    <rect x="0" y="0" width="110" height="88" rx="2" class="se-fill se-stroke" stroke-width="1.3"/>
    <line x1="0" y1="22" x2="110" y2="22" class="se-stroke" stroke-width="1"/>
    <line x1="0" y1="52" x2="110" y2="52" class="se-stroke-soft" stroke-width="0.8"/>
    <text x="55" y="15" text-anchor="middle" class="se-text" font-size="12" font-weight="700">LineItem</text>
    <text x="6" y="34" class="se-mono">- sku: str</text>
    <text x="6" y="44" class="se-mono">- qty: int</text>
    <text x="6" y="64" class="se-mono">+ subtotal()</text>
  </g>

  <!--
    Relationships:
      User → Order : association (open arrow)   "places  *"
      Order ◇→ LineItem : aggregation (open diamond on Order side)  "1..*"
  -->

  <!-- Association arrow: User → Order -->
  <line x1="130" y1="140" x2="165" y2="140" class="se-stroke" stroke-width="1.3" marker-end="url(#se-empty-tri)"/>
  <text x="148" y="132" text-anchor="middle" class="se-text se-italic" font-size="9.5" fill-opacity="0.85">places</text>
  <text x="148" y="156" text-anchor="middle" class="se-mono">1 ..  *</text>

  <!-- Aggregation: Order ◇— LineItem (diamond on Order side) -->
  <line x1="275" y1="140" x2="310" y2="140" class="se-stroke" stroke-width="1.3" marker-start="url(#se-empty-diamond)"/>
  <text x="293" y="132" text-anchor="middle" class="se-text se-italic" font-size="9.5" fill-opacity="0.85">contains</text>
  <text x="293" y="156" text-anchor="middle" class="se-mono">1 ..  *</text>

  <!-- Quiet figure label, classical academic mark -->
  <text x="412" y="266" text-anchor="end" class="se-text se-italic" font-size="9" fill-opacity="0.45">fig. 1</text>
</svg>
