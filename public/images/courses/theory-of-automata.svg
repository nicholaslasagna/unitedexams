<svg viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Theory of Automata — deterministic finite automaton">
  <defs>
    <style>
      .ta-stroke { stroke: #6ee7b7; stroke-opacity: 0.85; stroke-width: 1.5; fill: none; }
      .ta-stroke-soft { stroke: #6ee7b7; stroke-opacity: 0.5; stroke-width: 1; fill: none; }
      .ta-state-fill { fill: #052016; }
      .ta-text { fill: #ecfdf5; font-family: ui-serif, Georgia, "Times New Roman", serif; }
      .ta-italic { font-style: italic; }
    </style>
    <marker id="ta-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7b7"/>
    </marker>
  </defs>

  <!-- Solid ink background -->
  <rect width="440" height="280" rx="22" fill="#06231d"/>

  <!--
    Three-state DFA, q0 → q1 → q2 (accept).
    Edge labels in italic serif. Double circle on the accept state.
    No "active state" highlight. No vector field. No corner notation
    overload — just one quiet figure label.
  -->

  <!-- Edges (drawn first, under nodes) -->
  <!-- start arrow into q0 -->
  <line x1="34" y1="146" x2="62" y2="146" class="ta-stroke" marker-end="url(#ta-arrow)"/>

  <!-- q0 → q1 (top arc) — labeled 'a' -->
  <path d="M 102 134 C 132 96, 200 96, 230 134" class="ta-stroke" marker-end="url(#ta-arrow)"/>

  <!-- q1 → q0 (bottom arc) — labeled 'b' -->
  <path d="M 230 158 C 200 196, 132 196, 102 158" class="ta-stroke" marker-end="url(#ta-arrow)"/>

  <!-- q1 → q2 — labeled 'a' -->
  <line x1="270" y1="146" x2="316" y2="146" class="ta-stroke" marker-end="url(#ta-arrow)"/>

  <!-- q2 self-loop on top — labeled 'b' -->
  <path d="M 348 116 C 340 88, 380 88, 376 116" class="ta-stroke"/>
  <path d="M 374 117 l 4 -4 l -2 7 z" fill="#6ee7b7"/>

  <!-- States -->
  <!-- q0 -->
  <g>
    <circle cx="80" cy="146" r="24" class="ta-state-fill ta-stroke"/>
    <text x="80" y="151" text-anchor="middle" class="ta-text ta-italic" font-size="15" font-weight="600">q₀</text>
  </g>
  <!-- q1 -->
  <g>
    <circle cx="250" cy="146" r="24" class="ta-state-fill ta-stroke"/>
    <text x="250" y="151" text-anchor="middle" class="ta-text ta-italic" font-size="15" font-weight="600">q₁</text>
  </g>
  <!-- q2 (accepting) — double circle -->
  <g>
    <circle cx="362" cy="146" r="28" class="ta-state-fill ta-stroke"/>
    <circle cx="362" cy="146" r="22" class="ta-stroke-soft"/>
    <text x="362" y="151" text-anchor="middle" class="ta-text ta-italic" font-size="15" font-weight="600">q₂</text>
  </g>

  <!-- Edge labels -->
  <g class="ta-text ta-italic" font-size="13">
    <!-- 'a' on the top arc q0→q1 -->
    <text x="166" y="98" text-anchor="middle">a</text>
    <!-- 'b' on the bottom arc q1→q0 -->
    <text x="166" y="200" text-anchor="middle">b</text>
    <!-- 'a' on q1→q2 -->
    <text x="293" y="138" text-anchor="middle">a</text>
    <!-- 'b' on q2 self-loop -->
    <text x="362" y="80" text-anchor="middle">b</text>
  </g>

  <!-- Quiet alphabet annotation, classical math style -->
  <text x="32" y="246" class="ta-text ta-italic" font-size="11" fill-opacity="0.55">Σ = {a, b}</text>

  <!-- Page number mark -->
  <text x="412" y="22" text-anchor="end" class="ta-text ta-italic" font-size="9" fill-opacity="0.45">fig. 4</text>
</svg>
